<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Đăng nhập / Đăng ký - PhoneShop</title><link rel="stylesheet" href="css/style.css"></head><body class="center-page"><main class="login-box"><a class="logo" href="index.html">PhoneShop</a><div class="auth-tabs"><button id="loginTab" onclick="showAuth('login')">Đăng nhập</button><button id="registerTab" class="secondary" onclick="showAuth('register')">Tạo tài khoản</button></div><section id="loginSection"><h1>Đăng nhập</h1><form id="loginForm"><label>Tài khoản hoặc Email</label><input id="login" value="admin" required><label>Mật khẩu</label><input id="password" type="password" value="admin123" required><button type="submit">Đăng nhập</button></form></section><section id="registerSection" hidden><h1>Tạo tài khoản</h1><form id="registerForm"><label>Họ tên</label><input id="full_name" required><label>Username</label><input id="reg_username" required minlength="3"><label>Email</label><input id="email" type="email" required><label>Mật khẩu</label><input id="reg_password" type="password" required minlength="6"><label>Nhập lại mật khẩu</label><input id="reg_password2" type="password" required minlength="6"><button type="submit">Tạo tài khoản</button></form></section><div id="message"></div><br><a href="index.html">← Về trang sản phẩm</a></main><script src="js/config.js"></script><script>function showAuth(t){const l=t==='login';loginSection.hidden=!l;registerSection.hidden=l;loginTab.className=l?'':'secondary';registerTab.className=l?'secondary':'';message.textContent=''}async function postJson(e,b){const r=await fetch(API_BASE+e,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return await r.json()}loginForm.addEventListener('submit',async e=>{e.preventDefault();try{const d=await postJson('/api/login.php',{login:login.value,password:password.value});if(!d.success)throw Error(d.message);localStorage.setItem('admin_token',d.token);localStorage.setItem('account',JSON.stringify(d.account));location.href=d.account.role==='admin'?'admin.html':'index.html'}catch(x){message.className='error';message.textContent=x.message}});registerForm.addEventListener('submit',async e=>{e.preventDefault();if(reg_password.value!==reg_password2.value){message.className='error';message.textContent='Mật khẩu nhập lại không khớp.';return}try{const d=await postJson('/api/register.php',{full_name:full_name.value,username:reg_username.value,email:email.value,password:reg_password.value});if(!d.success)throw Error(d.message);message.className='success';message.textContent=d.message;setTimeout(()=>showAuth('login'),800)}catch(x){message.className='error';message.textContent=x.message}})</script></body></html>
